<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090a0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CinePlan" />
  <title>CinePlan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            surface: {
              bg: '#090a0d',
              card: '#12141a',
              elevated: '#191c24',
              border: '#232733',
              muted: '#7e8696'
            }
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      background-color: #050608;
      color: #f4f5f7;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      overscroll-behavior-y: contain;
    }
    .app-shell {
      min-height: 100dvh;
      max-height: 100dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #232733;
      border-radius: 9999px;
    }
    .sheet-anim {
      animation: sheetUp 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes sheetUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .fade-in {
      animation: fadeIn 0.14s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
      cursor: pointer;
    }
  </style>
</head>
<body class="min-h-[100dvh] flex justify-center bg-[#050608] selection:bg-amber-500 selection:text-black">

  <div id="app" class="app-shell w-full max-w-[390px] bg-surface-bg border-x border-surface-border/50 flex flex-col relative">
    <header id="app-header" class="sticky top-0 z-30 bg-surface-bg/95 backdrop-blur-md border-b border-surface-border/70 px-3 h-11 flex items-center justify-between gap-1.5 shrink-0">
    </header>

    <main id="app-main" class="flex-1 flex flex-col px-3 py-2.5 pb-5">
    </main>

    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-200">
      <div class="bg-surface-elevated border border-surface-border text-gray-100 text-[11px] font-medium px-3.5 py-1.5 rounded-full shadow-2xl">
        <span id="toast-msg">Сохранено</span>
      </div>
    </div>

    <div id="modal-backdrop" class="hidden fixed inset-0 z-40 bg-black/80 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="closeModalOnBackdrop(event)">
      <div id="modal-panel" class="w-full max-w-[390px] bg-surface-card border-t sm:border border-surface-border rounded-t-2xl sm:rounded-2xl max-h-[82dvh] overflow-y-auto flex flex-col shadow-2xl sheet-anim" onclick="event.stopPropagation()">
      </div>
    </div>

    <input type="file" id="json-import-input" accept=".json,application/json" class="hidden" onchange="handleImportJSON(event)" />
  </div>

  <script>
    const DB_KEY = 'cineplan_minimal_v2';

    const state = {
      projects: [],
      level: 1, // 1: Проекты | 2: Съёмки | 3: Съёмочный день | 4: Сцена
      projectId: null,
      shootId: null,
      sceneId: null
    };

    const TIME_OPTIONS = ['День', 'Ночь', 'Утро', 'Вечер', 'Сумерки'];

    const SCENE_STATUSES = [
      {
        key: 'not_shot',
        label: 'Не снято',
        short: 'Не снято',
        btnClass: 'bg-surface-bg text-surface-muted border-surface-border hover:text-white',
        badgeClass: 'bg-zinc-800/90 text-zinc-400 border-zinc-700/70',
        cardBorder: 'border-surface-border',
        strike: false
      },
      {
        key: 'in_progress',
        label: 'В процессе',
        short: 'В процессе',
        btnClass: 'bg-amber-500/20 text-amber-300 border-amber-500/40',
        badgeClass: 'bg-amber-500/15 text-amber-300 border-amber-500/30',
        cardBorder: 'border-amber-500/35',
        strike: false
      },
      {
        key: 'planned',
        label: 'В планах',
        short: 'В планах',
        btnClass: 'bg-sky-500/20 text-sky-300 border-sky-500/40',
        badgeClass: 'bg-sky-500/15 text-sky-300 border-sky-500/30',
        cardBorder: 'border-sky-500/35',
        strike: false
      },
      {
        key: 'shot',
        label: '✓ Снято',
        short: 'Снято',
        btnClass: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
        badgeClass: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30',
        cardBorder: 'border-emerald-500/35',
        strike: true
      }
    ];

    function getSceneStatusMeta(sc) {
      const key = sc.status || (sc.done ? 'shot' : 'not_shot');
      return SCENE_STATUSES.find(s => s.key === key) || SCENE_STATUSES[0];
    }

    function uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;
    }

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDateRu(isoDate) {
      if (!isoDate || isoDate === 'unplanned') return 'Ещё не запланировано';
      try {
        const [y, m, d] = isoDate.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        return dt.toLocaleDateString('ru-RU', {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        });
      } catch {
        return isoDate;
      }
    }

    let toastTimeout = null;
    function showToast(text) {
      const el = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = text;
      el.classList.remove('opacity-0', 'translate-y-2');
      el.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        el.classList.remove('opacity-100', 'translate-y-0');
        el.classList.add('opacity-0', 'translate-y-2');
      }, 1800);
    }

    function saveDB() {
      try {
        localStorage.setItem(DB_KEY, JSON.stringify({ projects: state.projects }));
      } catch (e) {
        showToast('Ошибка сохранения');
      }
    }

    function loadDB() {
      try {
        const raw = localStorage.getItem(DB_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.projects)) {
            state.projects = parsed.projects;
            return;
          }
        }
      } catch (e) {
        console.error(e);
      }
      state.projects = [];
    }

    function getProject() {
      return state.projects.find(p => p.id === state.projectId) || null;
    }

    function getShoot() {
      const p = getProject();
      return p ? (p.shoots || []).find(s => s.id === state.shootId) || null : null;
    }

    function getScene() {
      const s = getShoot();
      return s ? (s.scenes || []).find(sc => sc.id === state.sceneId) || null : null;
    }

    function goLevel1() {
      state.level = 1;
      state.projectId = null;
      state.shootId = null;
      state.sceneId = null;
      render();
    }

    function goLevel2(projectId) {
      state.level = 2;
      state.projectId = projectId;
      state.shootId = null;
      state.sceneId = null;
      render();
    }

    function goLevel3(shootId) {
      state.level = 3;
      state.shootId = shootId;
      state.sceneId = null;
      render();
    }

    function goLevel4(sceneId) {
      state.level = 4;
      state.sceneId = sceneId;
      render();
    }

    function openModal(html) {
      document.getElementById('modal-panel').innerHTML = html;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
      document.getElementById('modal-panel').innerHTML = '';
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'modal-backdrop') closeModal();
    }

    function renderBigCenterPlus(label, onClickAttr) {
      return `
        <div class="flex-1 flex flex-col items-center justify-center py-6 select-none fade-in">
          <button onclick="${onClickAttr}" aria-label="${esc(label)}" class="group w-16 h-16 rounded-2xl bg-surface-card hover:bg-surface-elevated border border-surface-border hover:border-amber-500/60 flex items-center justify-center shadow-xl active:scale-95 transition-all duration-150">
            <svg class="w-7 h-7 text-amber-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <span class="mt-2.5 text-xs font-medium text-surface-muted">${esc(label)}</span>
        </div>
      `;
    }

    function renderListPlusButton(label, onClickAttr) {
      return `
        <button onclick="${onClickAttr}" class="w-full py-2.5 rounded-xl bg-surface-card hover:bg-surface-elevated border border-dashed border-surface-border hover:border-amber-500/60 text-amber-400 font-semibold text-xs flex items-center justify-center gap-1.5 active:scale-[0.99] transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>${esc(label)}</span>
        </button>
      `;
    }

    function render() {
      const header = document.getElementById('app-header');
      const main = document.getElementById('app-main');

      if (state.level === 1) {
        renderLevel1Projects(header, main);
      } else if (state.level === 2) {
        renderLevel2Shoots(header, main);
      } else if (state.level === 3) {
        renderLevel3ShootDay(header, main);
      } else if (state.level === 4) {
        renderLevel4Scene(header, main);
      }
      document.getElementById('app').scrollTop = 0;
    }

    // ==========================================
    // LEVEL 1: ГЛАВНОЕ МЕНЮ (ПРОЕКТЫ)
    // ==========================================
    function renderLevel1Projects(header, main) {
      header.innerHTML = `
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-amber-400"></span>
          <h1 class="text-sm font-bold tracking-tight text-white">Главное меню</h1>
        </div>

        <button onclick="openBackupModal()" title="Резервная копия JSON" class="p-1.5 rounded-lg text-surface-muted hover:text-white hover:bg-surface-elevated transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
      `;

      if (state.projects.length === 0) {
        main.innerHTML = renderBigCenterPlus('Создать фильм / сериал', 'openCreateProjectModal()');
        return;
      }

      const cardsHtml = state.projects.map(proj => {
        const shootsCount = (proj.shoots || []).length;
        const scenesCount = (proj.shoots || []).reduce((acc, s) => acc + (s.scenes || []).length, 0);

        return `
          <div onclick="goLevel2('${proj.id}')" class="bg-surface-card hover:bg-surface-elevated border border-surface-border hover:border-amber-500/40 rounded-xl px-3 py-2.5 flex items-center justify-between gap-2 cursor-pointer active:scale-[0.99] transition fade-in">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5">
                <span class="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-400 leading-none">
                  ${esc(proj.type || 'Фильм')}
                </span>
                <h2 class="text-sm font-bold text-white truncate">${esc(proj.title)}</h2>
              </div>
              <p class="text-[11px] text-surface-muted mt-0.5 leading-tight">
                Съёмок: ${shootsCount} • Сцен: ${scenesCount}
              </p>
            </div>

            <div class="flex items-center gap-0.5 shrink-0">
              <button onclick="event.stopPropagation(); openDeleteConfirm('project', '${proj.id}', '${esc(proj.title)}')" class="p-1.5 rounded-lg text-surface-muted hover:text-rose-400 hover:bg-rose-500/10 transition" title="Удалить">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                </svg>
              </button>
              <svg class="w-4 h-4 text-surface-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </div>
          </div>
        `;
      }).join('');

      main.innerHTML = `
        <div class="space-y-2">
          ${cardsHtml}
          ${renderListPlusButton('Создать фильм / сериал', 'openCreateProjectModal()')}
        </div>
      `;
    }

    // ==========================================
    // LEVEL 2: ВНУТРИ ФИЛЬМА (ЗАПЛАНИРОВАННЫЕ СЪЁМКИ)
    // ==========================================
    function renderLevel2Shoots(header, main) {
      const proj = getProject();
      if (!proj) return goLevel1();

      header.innerHTML = `
        <button onclick="goLevel1()" class="flex items-center gap-0.5 text-xs font-semibold text-amber-400 hover:text-amber-300 py-1 pr-1 active:scale-95 transition shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Назад</span>
        </button>

        <h1 class="text-xs font-bold text-white truncate text-center flex-1">${esc(proj.title)}</h1>

        <button onclick="goLevel1()" class="px-2 py-1 rounded-lg bg-surface-elevated border border-surface-border text-[11px] font-semibold text-gray-200 hover:text-amber-400 active:scale-95 transition shrink-0">
          Главное
        </button>
      `;

      const shoots = [...(proj.shoots || [])].sort((a, b) => {
        const aUnplanned = !a.date || a.date === 'unplanned';
        const bUnplanned = !b.date || b.date === 'unplanned';
        if (aUnplanned && bUnplanned) return 0;
        if (aUnplanned) return 1;
        if (bUnplanned) return -1;
        return a.date.localeCompare(b.date);
      });

      if (shoots.length === 0) {
        main.innerHTML = renderBigCenterPlus('Запланировать съёмку', 'openCreateShootModal()');
        return;
      }

      const shootsHtml = shoots.map(shoot => {
        const scenes = shoot.scenes || [];
        const isUnplanned = !shoot.date || shoot.date === 'unplanned';

        const counts = {
          shot: 0,
          in_progress: 0,
          planned: 0,
          not_shot: 0
        };
        scenes.forEach(sc => {
          const st = getSceneStatusMeta(sc);
          counts[st.key] = (counts[st.key] || 0) + 1;
        });

        const summaryBadges = scenes.length > 0 ? `
          <div class="flex flex-wrap items-center gap-1 mt-1.5">
            ${counts.shot > 0 ? `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded border bg-emerald-500/15 text-emerald-300 border-emerald-500/30 leading-none">Снято: ${counts.shot}</span>` : ''}
            ${counts.in_progress > 0 ? `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded border bg-amber-500/15 text-amber-300 border-amber-500/30 leading-none">В процессе: ${counts.in_progress}</span>` : ''}
            ${counts.planned > 0 ? `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded border bg-sky-500/15 text-sky-300 border-sky-500/30 leading-none">В планах: ${counts.planned}</span>` : ''}
            ${counts.not_shot > 0 ? `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded border bg-zinc-800/90 text-zinc-400 border-zinc-700/70 leading-none">Не снято: ${counts.not_shot}</span>` : ''}
          </div>
        ` : '';

        const sceneChips = scenes.length > 0 ? `
          <div class="flex flex-wrap gap-1 mt-1.5 pt-1.5 border-t border-surface-border/60">
            ${scenes.map((sc, idx) => {
              const st = getSceneStatusMeta(sc);
              return `
                <span class="inline-flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded border ${st.badgeClass} max-w-full leading-tight">
                  <span class="font-bold opacity-75">#${idx + 1}</span>
                  <span class="truncate max-w-[95px]">${esc(sc.title)}</span>
                  <span class="opacity-80">• ${st.short}</span>
                </span>
              `;
            }).join('')}
          </div>
        ` : '';

        return `
          <div onclick="goLevel3('${shoot.id}')" class="bg-surface-card hover:bg-surface-elevated border border-surface-border hover:border-amber-500/40 rounded-xl px-3 py-2.5 flex items-center justify-between gap-2 cursor-pointer active:scale-[0.99] transition fade-in">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-[11px] font-semibold ${isUnplanned ? 'text-sky-400' : 'text-amber-400'} leading-tight">
                  ${formatDateRu(shoot.date)}
                </span>
                <button
                  type="button"
                  onclick="event.stopPropagation(); openEditShootDateModal('${shoot.id}')"
                  class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-surface-bg hover:bg-surface-elevated border border-surface-border text-gray-300 hover:text-amber-400 transition leading-none"
                >
                  Дата
                </button>
                <span class="text-[10px] text-surface-muted leading-none">• Сцен: ${scenes.length}</span>
              </div>
              <h2 class="text-sm font-bold text-white truncate mt-0.5">${esc(shoot.title)}</h2>
              ${summaryBadges}
              ${sceneChips}
            </div>

            <div class="flex items-center gap-0.5 shrink-0">
              <button onclick="event.stopPropagation(); openDeleteConfirm('shoot', '${shoot.id}', '${esc(shoot.title)}')" class="p-1.5 rounded-lg text-surface-muted hover:text-rose-400 hover:bg-rose-500/10 transition" title="Удалить">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                </svg>
              </button>
              <svg class="w-4 h-4 text-surface-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </div>
          </div>
        `;
      }).join('');

      main.innerHTML = `
        <div class="space-y-2">
          ${shootsHtml}
          ${renderListPlusButton('Запланировать съёмку', 'openCreateShootModal()')}
        </div>
      `;
    }

    // ==========================================
    // LEVEL 3: ВНУТРИ СЪЁМОЧНОГО ДНЯ (СЦЕНЫ + РЕКВИЗИТ)
    // ==========================================
    function renderLevel3ShootDay(header, main) {
      const proj = getProject();
      const shoot = getShoot();
      if (!proj || !shoot) return goLevel2(proj?.id);

      const isUnplanned = !shoot.date || shoot.date === 'unplanned';

      header.innerHTML = `
        <button onclick="goLevel2('${proj.id}')" class="flex items-center gap-0.5 text-xs font-semibold text-amber-400 hover:text-amber-300 py-1 pr-1 active:scale-95 transition shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Назад</span>
        </button>

        <div class="min-w-0 flex-1 text-center leading-none">
          <h1 class="text-xs font-bold text-white truncate">${esc(shoot.title)}</h1>
          <button
            type="button"
            onclick="openEditShootDateModal('${shoot.id}')"
            class="inline-flex items-center gap-1 text-[10px] font-semibold ${isUnplanned ? 'text-sky-400' : 'text-amber-400'} hover:underline mt-0.5"
          >
            <span>${formatDateRu(shoot.date)}</span>
            <span class="text-surface-muted">✎</span>
          </button>
        </div>

        <button onclick="goLevel1()" class="px-2 py-1 rounded-lg bg-surface-elevated border border-surface-border text-[11px] font-semibold text-gray-200 hover:text-amber-400 active:scale-95 transition shrink-0">
          Главное
        </button>
      `;

      const scenes = shoot.scenes || [];
      const props = shoot.props || [];

      if (scenes.length === 0 && props.length === 0) {
        main.innerHTML = `
          ${renderBigCenterPlus('Создать сцену', 'openCreateSceneModal()')}
          <div class="pt-1">
            <button onclick="openAddPropModal()" class="w-full py-2 rounded-xl bg-surface-card hover:bg-surface-elevated border border-surface-border text-xs font-semibold text-surface-muted hover:text-gray-200 transition">
              + Добавить реквизит на этот день
            </button>
          </div>
        `;
        return;
      }

      const scenesSectionHtml = scenes.length === 0
        ? renderListPlusButton('Создать сцену', 'openCreateSceneModal()')
        : `
          <div class="space-y-1.5">
            ${scenes.map((sc, index) => {
              const shots = sc.shots || [];
              const shotsCount = shots.length;
              const shotDoneCount = shots.filter(sh => !!sh.shotDone).length;
              const statusMeta = getSceneStatusMeta(sc);
              const metaParts = [
                sc.timeOfDay ? sc.timeOfDay : null,
                sc.location ? sc.location : null,
                sc.duration ? `⏱ ${sc.duration}` : null
              ].filter(Boolean);

              return `
                <div onclick="goLevel4('${sc.id}')" class="bg-surface-card hover:bg-surface-elevated border ${statusMeta.cardBorder} rounded-xl px-3 py-2 flex items-center justify-between gap-2 cursor-pointer active:scale-[0.99] transition fade-in">
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1.5">
                      <span class="text-[11px] font-bold text-surface-muted">#${index + 1}</span>
                      <h3 class="text-sm font-bold truncate ${statusMeta.strike ? 'text-gray-400 line-through' : 'text-white'}">
                        ${esc(sc.title)}
                      </h3>
                    </div>

                    <p class="text-[10px] text-surface-muted truncate mt-0.5 leading-tight">
                      ${metaParts.length > 0 ? esc(metaParts.join(' • ')) + ' • ' : ''}Кадров: ${shotsCount}${shotsCount > 0 ? ` (${shotDoneCount} снято)` : ''}
                    </p>
                  </div>

                  <div class="flex items-center gap-1 shrink-0" onclick="event.stopPropagation()">
                    <button
                      onclick="openSceneStatusModal('${sc.id}')"
                      class="px-2 py-1 rounded-lg text-[11px] font-bold border transition active:scale-95 ${statusMeta.btnClass}"
                    >
                      ${statusMeta.label}
                    </button>

                    <button onclick="openDeleteConfirm('scene', '${sc.id}', '${esc(sc.title)}')" class="p-1 rounded-lg text-surface-muted hover:text-rose-400 hover:bg-rose-500/10 transition" title="Удалить сцену">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                      </svg>
                    </button>
                  </div>
                </div>
              `;
            }).join('')}

            ${renderListPlusButton('Создать сцену', 'openCreateSceneModal()')}
          </div>
        `;

      const propsSectionHtml = `
        <div class="pt-3 space-y-1.5">
          <div class="flex items-center justify-between px-0.5">
            <h2 class="text-[10px] font-bold uppercase tracking-wider text-surface-muted">
              Реквизит (${props.length})
            </h2>
            <button onclick="openAddPropModal()" class="text-[11px] font-bold text-amber-400 hover:text-amber-300 py-0.5 px-2 rounded bg-amber-500/10 active:scale-95 transition">
              + Добавить
            </button>
          </div>

          ${props.length === 0 ? `
            <button onclick="openAddPropModal()" class="w-full py-2 rounded-xl bg-surface-card/60 hover:bg-surface-card border border-dashed border-surface-border text-[11px] text-surface-muted hover:text-gray-200 transition">
              + Добавить реквизит или предмет
            </button>
          ` : `
            <div class="bg-surface-card border border-surface-border rounded-xl divide-y divide-surface-border/70 overflow-hidden">
              ${props.map(item => `
                <div class="px-2.5 py-1.5 flex items-center justify-between gap-2">
                  <button onclick="togglePropPacked('${item.id}')" class="flex items-center gap-2 min-w-0 flex-1 text-left">
                    <div class="w-4 h-4 rounded border flex items-center justify-center shrink-0 transition ${item.packed ? 'bg-emerald-500 border-emerald-500 text-black' : 'border-surface-muted/60 bg-surface-bg'}">
                      ${item.packed ? `<svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>` : ''}
                    </div>
                    <span class="text-xs font-medium truncate ${item.packed ? 'line-through text-surface-muted' : 'text-white'}">
                      ${esc(item.name)}
                    </span>
                  </button>

                  <div class="flex items-center gap-1 shrink-0">
                    <button onclick="changePropQty('${item.id}', -1)" class="w-6 h-6 rounded bg-surface-bg hover:bg-surface-elevated border border-surface-border text-gray-300 font-bold text-xs flex items-center justify-center">−</button>
                    <span class="w-5 text-center text-xs font-bold text-amber-400">${item.qty || 1}</span>
                    <button onclick="changePropQty('${item.id}', 1)" class="w-6 h-6 rounded bg-surface-bg hover:bg-surface-elevated border border-surface-border text-gray-300 font-bold text-xs flex items-center justify-center">+</button>
                    <button onclick="deleteProp('${item.id}')" class="p-1 rounded text-surface-muted hover:text-rose-400 text-xs" title="Удалить">✕</button>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;

      main.innerHTML = `
        <div class="space-y-1.5">
          <div class="px-0.5">
            <h2 class="text-[10px] font-bold uppercase tracking-wider text-surface-muted">
              Сцены (${scenes.length})
            </h2>
          </div>
          ${scenesSectionHtml}
        </div>
        ${propsSectionHtml}
      `;
    }

    // ==========================================
    // LEVEL 4: ВНУТРИ СЦЕНЫ (ПАРАМЕТРЫ + КАДРЫ)
    // ==========================================
    function renderLevel4Scene(header, main) {
      const proj = getProject();
      const shoot = getShoot();
      const scene = getScene();
      if (!proj || !shoot || !scene) return goLevel3(shoot?.id);

      header.innerHTML = `
        <button onclick="goLevel3('${shoot.id}')" class="flex items-center gap-0.5 text-xs font-semibold text-amber-400 hover:text-amber-300 py-1 pr-1 active:scale-95 transition shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Назад</span>
        </button>

        <h1 class="text-xs font-bold text-white truncate text-center flex-1">${esc(scene.title)}</h1>

        <button onclick="goLevel1()" class="px-2 py-1 rounded-lg bg-surface-elevated border border-surface-border text-[11px] font-semibold text-gray-200 hover:text-amber-400 active:scale-95 transition shrink-0">
          Главное
        </button>
      `;

      const shots = scene.shots || [];

      const settingsCard = `
        <div class="bg-surface-card border border-surface-border rounded-xl p-2.5 space-y-2 fade-in">
          <div>
            <label class="block text-[10px] font-bold uppercase tracking-wider text-surface-muted mb-1">Время суток</label>
            <div class="flex flex-wrap gap-1">
              ${TIME_OPTIONS.map(t => {
                const active = scene.timeOfDay === t;
                return `
                  <button
                    type="button"
                    onclick="updateSceneField('timeOfDay', '${t}')"
                    class="px-2 py-1 rounded-lg text-[11px] font-semibold border transition ${
                      active
                        ? 'bg-amber-500 text-black border-amber-500'
                        : 'bg-surface-bg text-gray-300 border-surface-border hover:border-gray-600'
                    }"
                  >
                    ${t}
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] font-bold uppercase tracking-wider text-surface-muted mb-0.5">Локация</label>
              <input
                type="text"
                value="${esc(scene.location || '')}"
                oninput="updateSceneField('location', this.value)"
                placeholder="Локация..."
                class="w-full bg-surface-bg border border-surface-border focus:border-amber-500 rounded-lg px-2.5 py-1.5 text-xs text-white placeholder-zinc-600 focus:outline-none"
              />
            </div>

            <div>
              <label class="block text-[10px] font-bold uppercase tracking-wider text-surface-muted mb-0.5">Хронометраж</label>
              <input
                type="text"
                value="${esc(scene.duration || '')}"
                oninput="updateSceneField('duration', this.value)"
                placeholder="01:30 / 45 сек"
                class="w-full bg-surface-bg border border-surface-border focus:border-amber-500 rounded-lg px-2.5 py-1.5 text-xs text-white placeholder-zinc-600 focus:outline-none"
              />
            </div>
          </div>
        </div>
      `;

      if (shots.length === 0) {
        main.innerHTML = `
          ${settingsCard}
          ${renderBigCenterPlus('Создать кадр', 'addShotToScene()')}
        `;
        return;
      }

      const shotsHtml = shots.map((shot, idx) => {
        const isShotDone = !!shot.shotDone;
        return `
          <div class="bg-surface-card border ${isShotDone ? 'border-emerald-500/35' : 'border-surface-border'} rounded-xl p-2.5 space-y-1.5 fade-in">
            <div class="flex items-center justify-between gap-1.5">
              <div class="flex items-center gap-1.5">
                <span class="px-2 py-0.5 rounded bg-amber-500/15 text-amber-400 text-[11px] font-extrabold">
                  Кадр ${idx + 1}
                </span>

                <button
                  type="button"
                  onclick="toggleShotDone('${shot.id}')"
                  class="px-2 py-0.5 rounded text-[10px] font-bold border transition active:scale-95 ${
                    isShotDone
                      ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
                      : 'bg-surface-bg text-surface-muted border-surface-border hover:text-white'
                  }"
                >
                  ${isShotDone ? '✓ Снято' : 'Не снято'}
                </button>
              </div>

              <div class="flex items-center gap-0.5 shrink-0">
                ${idx > 0 ? `
                  <button onclick="moveShot(${idx}, -1)" class="p-1 rounded text-surface-muted hover:text-white hover:bg-surface-elevated text-xs" title="Выше">↑</button>
                ` : ''}
                ${idx < shots.length - 1 ? `
                  <button onclick="moveShot(${idx}, 1)" class="p-1 rounded text-surface-muted hover:text-white hover:bg-surface-elevated text-xs" title="Ниже">↓</button>
                ` : ''}
                <button onclick="deleteShot('${shot.id}')" class="p-1 rounded text-surface-muted hover:text-rose-400 hover:bg-rose-500/10" title="Удалить кадр">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                  </svg>
                </button>
              </div>
            </div>

            <textarea
              rows="2"
              oninput="updateShotDesc('${shot.id}', this.value)"
              placeholder="Описание кадра, движение, реплики..."
              class="w-full bg-surface-bg border border-surface-border focus:border-amber-500 rounded-lg p-2 text-xs text-white placeholder-zinc-600 focus:outline-none leading-snug ${isShotDone ? 'text-gray-300' : ''}"
            >${esc(shot.desc || '')}</textarea>
          </div>
        `;
      }).join('');

      main.innerHTML = `
        ${settingsCard}

        <div class="pt-2.5 space-y-2">
          <div class="px-0.5">
            <h2 class="text-[10px] font-bold uppercase tracking-wider text-surface-muted">
              Кадры (${shots.length})
            </h2>
          </div>

          ${shotsHtml}

          ${renderListPlusButton('Создать кадр', 'addShotToScene()')}
        </div>
      `;
    }

        </div>

    function submitCreateProject(e) {
      e.preventDefault();
      const title = document.getElementById('new-proj-title').value.trim();
      const type = document.querySelector('input[name="proj-type"]:checked')?.value || 'Фильм';
      if (!title) return;

      const proj = {
        id: uid('proj'),
        type,
        title,
        shoots: []
      };

      state.projects.unshift(proj);
      saveDB();
      closeModal();
      goLevel2(proj.id);

        <div class="p-4 space-y-3">

              <label class="block text-[11px] font-semibold text-surface-muted mb-1">Название съёмочного дня</label>

          </form>
        </div>

      setTimeout(() => document.getElementById('new-shoot-title')?.focus(), 80);

    function toggleShootDateMode(mode) {
      const wrap = document.getElementById('shoot-date-picker-wrap');
      const input = document.getElementById('new-shoot-date');
      if (!wrap || !input) return;

      if (mode === 'unplanned') {
        wrap.classList.add('hidden');
        input.required = false;
      } else {
        wrap.classList.remove('hidden');
        input.required = true;
      }
    }

    function submitCreateShoot(e) {
      e.preventDefault();
      const proj = getProject();
      if (!proj) return;

      const title = document.getElementById('new-shoot-title').value.trim();
      const mode = document.querySelector('input[name="shoot-date-mode"]:checked')?.value || 'date';
      const date = mode === 'unplanned' ? 'unplanned' : document.getElementById('new-shoot-date').value;
      if (!title) return;

      const shoot = {
        id: uid('shoot'),
        title,
        date,
        scenes: [],
        props: []
      };

      if (!proj.shoots) proj.shoots = [];
      proj.shoots.push(shoot);
      saveDB();
      closeModal();
      goLevel3(shoot.id);
    }

    function openEditShootDateModal(shootId) {
      const proj = getProject();
      const shoot = (proj?.shoots || []).find(s => s.id === shootId);
      if (!shoot) return;

      const today = new Date().toISOString().split('T')[0];
      const isUnplanned = !shoot.date || shoot.date === 'unplanned';
      const dateVal = !isUnplanned ? shoot.date : today;

      openModal(`
        <div class="p-4 space-y-3">
          <div class="flex items-center justify-between">
            <div class="min-w-0 pr-2">
              <h3 class="text-sm font-bold text-white">Изменить дату съёмки</h3>
              <p class="text-[11px] text-surface-muted truncate">${esc(shoot.title)}</p>

              </label>

      if (!wrap || !input) return;

      if (mode === 'unplanned') {

    function submitEditShootDate(e, shootId) {
      e.preventDefault();
      const proj = getProject();
      const shoot = (proj?.shoots || []).find(s => s.id === shootId);
      if (!shoot) return;

      const mode = document.querySelector('input[name="edit-shoot-date-mode"]:checked')?.value || 'date';
      const newDate = mode === 'unplanned' ? 'unplanned' : document.getElementById('edit-shoot-date').value;
      if (mode === 'date' && !newDate) return;

      shoot.date = newDate;
      saveDB();
      closeModal();
      showToast('Дата обновлена');
      render();

    function openCreateSceneModal() {
      openModal(`

          <div class="flex items-center justify-between">
            <h3 class="text-sm font-bold text-white">Новая сцена</h3>

              <input id="new-scene-title" type="text" required placeholder="Название сцены..." class="w-full bg-surface-bg border border-surface-border focus:border-amber-500 rounded-lg px-3 py-2 text-xs text-white placeholder-zinc-600 focus:outline-none" />
            </div>

            <button type="submit" class="w-full py-2.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs active:scale-[0.99] transition">
              Создать
            </button>
          </form>
        </div>
      `);
      setTimeout(() => document.getElementById('new-scene-title')?.focus(), 80);

    function submitCreateScene(e) {
      e.preventDefault();
      const shoot = getShoot();
      if (!shoot) return;

      const title = document.getElementById('new-scene-title').value.trim();
      if (!title) return;

      const scene = {
        id: uid('sc'),
        title,
        timeOfDay: 'День',
        location: '',
        duration: '',
        status: 'not_shot',
        done: false,
        shots: []
      };

      if (!shoot.scenes) shoot.scenes = [];
      shoot.scenes.push(scene);
      saveDB();
      closeModal();
      render();

    function openSceneStatusModal(sceneId) {
      const shoot = getShoot();
      const sc = shoot?.scenes?.find(s => s.id === sceneId);
      if (!sc) return;

      const currentMeta = getSceneStatusMeta(sc);

      openModal(`
        <div class="p-4 space-y-2.5">
          <div class="flex items-center justify-between">
            <div class="min-w-0 pr-2">
              <h3 class="text-sm font-bold text-white">Статус сцены</h3>
              <p class="text-[11px] text-surface-muted truncate">${esc(sc.title)}</p>
            </div>
            <button onclick="closeModal()" class="p-1 text-surface-muted hover:text-white shrink-0 text-xs">✕</button>
          </div>

          <div class="grid grid-cols-1 gap-1.5">
            ${SCENE_STATUSES.map(st => {
              const isSelected = currentMeta.key === st.key;
              return `
                <button
                  type="button"
                  onclick="setSceneStatus('${sc.id}', '${st.key}')"
                  class="w-full px-3 py-2 rounded-lg text-left text-xs font-bold border flex items-center justify-between transition active:scale-[0.99] ${st.btnClass} ${isSelected ? 'ring-1 ring-white/30' : ''}"
                >
                  <span>${st.label}</span>
                  ${isSelected ? '<span class="text-[10px] opacity-80">Текущий</span>' : ''}
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `);
    }

    function setSceneStatus(sceneId, statusKey) {
      const shoot = getShoot();
      const sc = shoot?.scenes?.find(s => s.id === sceneId);
      if (!sc) return;
      sc.status = statusKey;
      sc.done = statusKey === 'shot';
      saveDB();
      closeModal();
      render();
    }

    function openAddPropModal() {
      openModal(`
        <div class="p-4 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-bold text-white">Добавить реквизит</h3>
            <button onclick="closeModal()" class="p-1 text-surface-muted hover:text-white text-xs">✕</button>
          </div>

          <form onsubmit="submitAddProp(event)" class="space-y-2.5">
            <div>
              <label class="block text-[11px] font-semibold text-surface-muted mb-1">Название предмета</label>
              <input id="new-prop-name" type="text" required placeholder="Например: Фонарик, рация..." class="w-full bg-surface-bg border border-surface-border focus:border-amber-500 rounded-lg px-3 py-2 text-xs text-white placeholder-zinc-600 focus:outline-none" />
            </div>

            <div>
              <label class="block text-[11px] font-semibold text-surface-muted mb-1">Количество</label>
              <input id="new-prop-qty" type="number" min="1" max="999" value="1" class="w-full bg-surface-bg border border-surface-border focus:border-amber-500 rounded-lg px-3 py-2 text-xs text-white font-bold focus:outline-none" />
            </div>

            <button type="submit" class="w-full py-2.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs active:scale-[0.99] transition">
              Добавить
            </button>
          </form>
        </div>
      `);
      setTimeout(() => document.getElementById('new-prop-name')?.focus(), 80);
    }

    function submitAddProp(e) {
      e.preventDefault();
      const shoot = getShoot();
      if (!shoot) return;

      const name = document.getElementById('new-prop-name').value.trim();
      const qty = Math.max(1, parseInt(document.getElementById('new-prop-qty').value, 10) || 1);
      if (!name) return;

      if (!shoot.props) shoot.props = [];
      shoot.props.push({
        id: uid('prop'),
        name,
        qty,
        packed: false
      });

      saveDB();
      closeModal();
      render();
    }

    function togglePropPacked(propId) {
      const shoot = getShoot();
      const item = shoot?.props?.find(p => p.id === propId);
      if (!item) return;
      item.packed = !item.packed;
      saveDB();
      render();
    }

    function changePropQty(propId, delta) {
      const shoot = getShoot();
      const item = shoot?.props?.find(p => p.id === propId);
      if (!item) return;
      item.qty = Math.max(1, (Number(item.qty) || 1) + delta);
      saveDB();
      render();
    }

    function deleteProp(propId) {
      const shoot = getShoot();
      if (!shoot) return;
      shoot.props = (shoot.props || []).filter(p => p.id !== propId);
      saveDB();
      render();
    }

    function updateSceneField(field, value) {
      const scene = getScene();
      if (!scene) return;
      scene[field] = value;
      saveDB();
      if (field === 'timeOfDay') {
        render();
      }
    }

    function addShotToScene() {
      const scene = getScene();
      if (!scene) return;
      if (!scene.shots) scene.shots = [];

      const newShot = {
        id: uid('shot'),
        desc: '',
        shotDone: false
      };
      scene.shots.push(newShot);
      saveDB();
      render();

      setTimeout(() => {
        const textareas = document.querySelectorAll('textarea');
        if (textareas.length > 0) {
          textareas[textareas.length - 1].focus();
        }
      }, 50);
    }

    function toggleShotDone(shotId) {
      const scene = getScene();
      const shot = scene?.shots?.find(s => s.id === shotId);
      if (!shot) return;
      shot.shotDone = !shot.shotDone;
      saveDB();
      render();
    }

    function updateShotDesc(shotId, value) {
      const scene = getScene();
      const shot = scene?.shots?.find(s => s.id === shotId);
      if (!shot) return;
      shot.desc = value;
      saveDB();
    }

    function deleteShot(shotId) {
      const scene = getScene();
      if (!scene) return;
      scene.shots = (scene.shots || []).filter(s => s.id !== shotId);
      saveDB();
      render();
    }

    function moveShot(index, direction) {
      const scene = getScene();
      if (!scene || !scene.shots) return;
      const target = index + direction;
      if (target < 0 || target >= scene.shots.length) return;
      const temp = scene.shots[index];
      scene.shots[index] = scene.shots[target];
      scene.shots[target] = temp;
      saveDB();
      render();
    }

    function openDeleteConfirm(type, id, name) {
      const labels = {
        project: 'Удалить проект',
        shoot: 'Удалить съёмочный день',
        scene: 'Удалить сцену'
      };

      openModal(`
        <div class="p-4 space-y-3">
          <h3 class="text-sm font-bold text-white">${labels[type] || 'Удалить'}?</h3>
          <p class="text-[11px] text-surface-muted leading-relaxed">
            «${esc(name)}» будет удалено без возможности восстановления.
          </p>
          <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="closeModal()" class="py-2 rounded-lg bg-surface-elevated text-gray-200 font-semibold text-xs">
              Отмена
            </button>
            <button onclick="executeDelete('${type}', '${id}')" class="py-2 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs">
              Удалить
            </button>
          </div>
        </div>
      `);
    }

    function executeDelete(type, id) {
      if (type === 'project') {
        state.projects = state.projects.filter(p => p.id !== id);
      } else if (type === 'shoot') {
        const proj = getProject();
        if (proj) proj.shoots = (proj.shoots || []).filter(s => s.id !== id);
      } else if (type === 'scene') {
        const shoot = getShoot();
        if (shoot) shoot.scenes = (shoot.scenes || []).filter(sc => sc.id !== id);
      }
      saveDB();
      closeModal();
      showToast('Удалено');
      render();
    }

    function openBackupModal() {
      openModal(`
        <div class="p-4 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-bold text-white">Перенос данных (JSON)</h3>
            <button onclick="closeModal()" class="p-1 text-surface-muted hover:text-white text-xs">✕</button>
          </div>

          <p class="text-[11px] text-surface-muted leading-relaxed">
            Сохраните файл на компьютере и откройте на телефоне, чтобы перенести все фильмы, сцены и кадры.
          </p>

          <div class="space-y-2">
            <button onclick="exportJSON()" class="w-full py-2.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs">
              Скачать резервную копию (.json)
            </button>
            <button onclick="document.getElementById('json-import-input').click()" class="w-full py-2.5 rounded-lg bg-surface-elevated border border-surface-border text-white font-bold text-xs">
              Загрузить из файла (.json)
            </button>
          </div>
        </div>
      `);
    }

    function exportJSON() {
      const data = JSON.stringify({ version: 2, projects: state.projects }, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cineplan_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      closeModal();
      showToast('Файл сохранён');
    }

    function handleImportJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed || !Array.isArray(parsed.projects)) throw new Error();
          state.projects = parsed.projects;
          saveDB();
          closeModal();
          showToast('Проекты загружены');
          goLevel1();
        } catch {
          showToast('Неверный формат файла');
        } finally {
          e.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadDB();
      render();
    });
  </script>
</body>
</html>
